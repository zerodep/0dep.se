name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dev deps
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build site
        run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      # Push-index the deployed pages with Bing, Yandex, Naver, and Seznam.
      # The key is public by design and served from static/<key>.txt.
      - name: Ping IndexNow
        continue-on-error: true
        run: |
          curl -sS -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d '{
              "host": "0dep.se",
              "key": "a70d5a0538ce1c4cba2f31cc7cbd60b8",
              "keyLocation": "https://0dep.se/a70d5a0538ce1c4cba2f31cc7cbd60b8.txt",
              "urlList": [
                "https://0dep.se/",
                "https://0dep.se/run/",
                "https://0dep.se/dmn/",
                "https://0dep.se/tools/",
                "https://0dep.se/about/"
              ]
            }'
